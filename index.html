<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Weather App</h1>
    <div>
      <div class="input-container">
        <input type="text" id="cityInput" placeholder="Enter city name" />
        <input
          type="text"
          id="stateInput"
          placeholder="Enter Province or State"
        />
        <input type="text" id="countryInput" placeholder="Enter Country" />
      </div>
      <div class="getWeather-container">
        <button id="getWeatherBtn">Get Weather</button>
      </div>
      <div id="weatherResult">
        <table>
          <tr>
            <th>Weather Information</th>
            <th>Data</th>
          </tr>
          <tr>
            <td>Location</td>
            <td id="location"></td>
          </tr>
          <tr>
            <td>Current Temprature</td>
            <td id="currentTemperature"></td>
          </tr>
          <tr>
            <td>Apparent Temperature (Feels Like)</td>
            <td id="apparentTemperature"></td>
          </tr>
          <tr>
            <td>Wind Speed</td>
            <td id="windSpeed"></td>
          </tr>
          <tr>
            <td>Relative Humidity</td>
            <td id="humidity"></td>
          </tr>
        </table>
      </div>
      <div id="errorMessage" class="errorMessage"></div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
